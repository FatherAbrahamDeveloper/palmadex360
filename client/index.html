<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-palmadex.png" />
    <link rel="apple-touch-icon" href="/palmadex-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005a8c" />
    <title>Palmadex 360 - Africa's Premier Export Manager</title>
    <script>
      // Apply the saved theme before the page paints, to avoid a white flash in dark mode.
      try {
        var t = localStorage.getItem("palmadex-theme") || "system";
        if (t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
